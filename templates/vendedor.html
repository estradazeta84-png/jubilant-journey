<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Vendedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Registro de Puesto</h2>
                    <form action="/vendedor" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Puesto</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="whatsapp" class="form-label">Número de WhatsApp</label>
                            <input type="text" class="form-control" id="whatsapp" name="whatsapp" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="menu" class="form-label">Menú o Descripción de la comida</label>
                            <textarea class="form-control" id="menu" name="menu" rows="3" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Registrarse y Pagar Suscripción</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
