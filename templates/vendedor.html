<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Vendedor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f1f2f6; margin: 0; padding: 20px; color: #2f3542; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #ff4757; text-align: center; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ced6e0; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #ff4757; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; font-size: 15px; margin-top: 20px; cursor: pointer; }
        button:hover { background-color: #ff6b81; }
        .regresar { display: block; text-align: center; margin-top: 15px; color: #747d8c; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registro de Menú</h2>
        <form method="POST">
            <label>Nombre de tu puesto:</label>
            <input type="text" name="nombre" placeholder="Ej. Cocina Doña Mary" required>

            <label>¿Qué vas a vender y cuántas porciones tienes?</label>
            <input type="text" name="detalle" placeholder="Ej. Enchiladas • Quedan 12 órdenes" required>

            <label>Tu número de WhatsApp (10 dígitos):</label>
            <input type="text" name="telefono" placeholder="Ej. 5512345678" required>

            <button type="submit">Publicar mi menú</button>
        </form>
        <a href="/" class="regresar">← Volver al catálogo</a>
    </div>
</body>
</html>
